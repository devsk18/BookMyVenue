# services/media-service/docker-compose.yml

services:
  media-service:
    build:
      context: ./services/media-service    # relative to root docker-compose.yml
      dockerfile: Dockerfile
      target: runtime                      # use the final stage of multi-stage build
    restart: unless-stopped
    networks:
      - bmv_public      # traefik can reach it
      - bmv_internal    # can reach postgres + minio
    depends_on:
      pgbouncer:
        condition: service_healthy         # wait for postgres healthcheck to pass
      minio:
        condition: service_healthy         # wait for minio healthcheck to pass
    environment:
      PORT: 3004
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/media_db
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      MAX_IMAGES_PER_VENUE: 5
      ALLOWED_MIME_TYPES: image/jpeg,image/png,image/webp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s    # grace period while node starts up
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      # tell traefik this container exists
      - "traefik.enable=true"

      # route: any request to /api/v1/media/* goes to media-service
      - "traefik.http.routers.media-service.rule=PathPrefix(`/api/v1/media`)"
      - "traefik.http.routers.media-service.entrypoints=web"

      # which port on the container to forward to
      - "traefik.http.services.media-service.loadbalancer.server.port=3004"